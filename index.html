<style>
:root{
  --orange:#E94E1E; --orange-d:#C63F14; --amber:#F8AD35; --amber-l:#FFF1D9;
  --cream:#FFF8F0; --card:#fff; --ink:#2B2320; --muted:#8A7F79; --line:#F0E2D4;
  --ok:#1B9C64; --ok-bg:#E7F6EF; --err:#D3392B; --err-bg:#FDECEA; --blue:#2E6BB8;
  --sh:0 8px 22px rgba(120,80,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;font-size:15px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:var(--orange)}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1100px 500px at 50% -10%,#FFE7D2 0%,var(--cream) 60%)}
.lbox{width:100%;max-width:380px}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.brand img{width:76px;height:76px;border-radius:22px;object-fit:cover;box-shadow:0 10px 26px rgba(233,78,30,.25)}
.brand h1{margin:6px 0 0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.brand small{color:var(--muted);font-size:12.5px;font-weight:500}

/* ---------- SHELL ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(255,248,240,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:11px;object-fit:cover;flex:none}
header .ht{flex:1;min-width:0}
header .ht b{display:block;font-size:15px;font-weight:700;line-height:1.15}
header .ht span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--amber-l);color:#8A5B00;flex:none}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:11px;width:36px;height:36px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
main{max-width:640px;margin:0 auto;padding:14px 14px 96px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(120,80,40,.06)}
nav button{flex:1;border:none;background:none;padding:7px 2px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600}
nav button i{font-style:normal;font-size:19px;line-height:1}
nav button.on{color:var(--orange);background:#FFF1EC}

/* ---------- COMPONENTS ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card.tight{padding:13px}
.ctitle{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:18px 0 8px}
label{display:block;font-weight:600;font-size:12.5px;margin:0 0 5px;color:#5d514b}
.fg{margin-bottom:12px}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(248,173,53,.18)}
textarea{resize:vertical;min-height:64px}
.btn{width:100%;padding:13px;border:none;border-radius:13px;background:var(--orange);color:#fff;
  font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(233,78,30,.24)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.amber{background:var(--amber);color:#4a3000;box-shadow:0 6px 16px rgba(248,173,53,.28)}
.btn.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--orange);box-shadow:none}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.msg{margin-top:10px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:500;display:none}
.msg.show{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--err-bg);color:var(--err)}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;color:var(--muted);
  padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:700;font-size:11.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.3px;padding:8px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #F7EEE4;vertical-align:top}
tr:last-child td{border-bottom:none}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.qty{font-weight:700;color:var(--orange)}
.val{font-weight:700;color:#1B7A4B}
.empty{text-align:center;padding:34px 14px;color:var(--muted);font-size:13.5px}
.empty .ei{font-size:34px;margin-bottom:8px}
.spin{display:inline-block;width:17px;height:17px;border:2.5px solid var(--line);border-top-color:var(--orange);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-late{background:#FFF1D9;color:#9A6200}
.b-off{background:#F2EDE8;color:var(--muted)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px}
.stat .s{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat .s b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.stat .s span{font-size:11px;color:var(--muted);font-weight:600}
.note{font-size:12px;color:var(--muted);background:#FFFDF8;border-left:3px solid var(--amber);
  border-radius:9px;padding:9px 11px;line-height:1.5;margin-bottom:12px}

/* kamera absensi */
.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:290px;background:#181310;border-radius:15px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.cam video,.cam img{width:100%;height:100%;object-fit:cover}
.cam .ph{color:#8b8078;font-size:12.5px;padding:16px;text-align:center}
.photo{width:100%;border-radius:13px;max-height:230px;object-fit:cover}

/* list input SO / Inbound */
.ilist{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.irow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #F7EEE4;background:#fff}
.irow:last-child{border-bottom:none}
.irow.filled{background:#FFFBF4}
.irow .nm{flex:1;min-width:0;font-size:13.5px;font-weight:500;line-height:1.25}
.irow .nm small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.irow input{width:82px;flex:none;padding:8px 9px;text-align:right;border-radius:10px;font-size:14px}
.stickybar{position:sticky;bottom:82px;z-index:10;background:rgba(255,248,240,.95);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:15px;padding:10px 12px;margin-top:12px;display:flex;align-items:center;gap:10px}
.stickybar .cnt{flex:1;font-size:12.5px;font-weight:600;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,20,14,.55);display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal .mb{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal .mh b{flex:1;font-size:16px;font-weight:700}
@media(min-width:641px){.modal{align-items:center}.modal .mb{border-radius:20px;max-height:82dvh}}
</style>
</head>

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function rp(n){ return 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID'); }
function nf(n){ var x=Number(n)||0; return (Math.round(x*100)/100).toLocaleString('id-ID'); }
function todayISO(){ var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fmtTgl(s){ if(!s) return '—'; var p=String(s).split('-'); if(p.length<3) return s;
  var b=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return Number(p[2])+' '+b[Number(p[1])-1]+' '+p[0]; }
function fmtTglShort(s){ if(!s) return '—'; var p=String(s).split('-'); return p[2]+'/'+p[1]; }
function daysAgo(n){ var d=new Date(); d.setDate(d.getDate()-n);
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function firstOfMonth(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),1,12).toISOString().slice(0,10); }
function say(el, text, ok){ var m=$(el); if(!m) return; m.className='msg show '+(ok?'ok':'err'); m.textContent=text; }
function hideMsg(el){ var m=$(el); if(m) m.className='msg'; }

/* --- API: POST text/plain supaya tidak kena CORS preflight --- */
async function api(action, params){
  var body = Object.assign({ action:action, token:S.token }, params||{});
  var res = await fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  var txt = await res.text();
  var j;
  try { j = JSON.parse(txt); }
  catch(e){ throw new Error('Respons server tidak valid. Cek deployment Apps Script (akses harus "Anyone").'); }
  if(j && j.expired){ forceLogout('Sesi habis, silakan login ulang.'); throw new Error('Sesi habis'); }
  return j;
}

/* --- kompres foto di browser --- */
function compress(file, maxPx, quality){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,m=maxPx||900;
        if(w>h && w>m){ h=Math.round(h*m/w); w=m; } else if(h>m){ w=Math.round(w*m/h); h=m; }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        var q=quality||0.55, out=cv.toDataURL('image/jpeg',q);
        while(out.length>900000 && q>0.28){ q-=0.08; out=cv.toDataURL('image/jpeg',q); }
        resolve(out);
      };
      img.onerror=function(){ reject(new Error('Gagal membaca gambar')); };
      img.src=e.target.result;
    };
    r.onerror=function(){ reject(new Error('Gagal membaca file')); };
    r.readAsDataURL(file);
  });
}

/* fallback foto: kalau lh3 gagal, ambil base64 lewat API */
async function photoFallback(imgEl, url){
  try{
    var m=String(url).match(/[-\w]{25,}/); if(!m) return;
    var r=await api('getPhoto',{ fileId:m[0] });
    if(r && r.ok && r.data) imgEl.src=r.data;
  }catch(e){}
}
window.photoFallback=photoFallback;
function zoomPhoto(url){
  openModal('Foto','<img class="photo" style="max-height:none" src="'+esc(url)+'" onerror="photoFallback(this,\''+esc(url)+'\')">');
}
window.zoomPhoto=zoomPhoto;
function imgTag(url, cls){
  if(!url) return '';
  return '<img class="'+(cls||'photo')+'" src="'+esc(url)+'" loading="lazy" style="cursor:zoom-in" '+
    'onclick="zoomPhoto(\''+esc(url)+'\')" onerror="photoFallback(this,\''+esc(url)+'\')">';
}
window.imgTag=imgTag;

async function doLogin(){
  var u=$('lu').value.trim(), p=$('lp').value;
  if(!u||!p){ say('lmsg','Username & password wajib diisi'); return; }
  $('lbtn').disabled=true; $('lbtn').innerHTML='<span class="spin"></span> Masuk...';
  try{
    var r=await api('login',{ username:u, password:p });
    if(!r.ok){ say('lmsg', r.msg||'Login gagal'); return; }
    S.token=r.token; S.user=r.user;
    localStorage.setItem('monty_tok', r.token);
    localStorage.setItem('monty_usr', JSON.stringify(r.user));
    await bootApp();
  }catch(e){ say('lmsg', e.message); }
  finally{ $('lbtn').disabled=false; $('lbtn').textContent='Masuk'; }
}
window.doLogin=doLogin;
$('lp').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

async function doLogout(){
  if(!confirm('Keluar dari aplikasi?')) return;
  try{ await api('logout',{}); }catch(e){}
  forceLogout('');
}
window.doLogout=doLogout;

function forceLogout(msg){
  localStorage.removeItem('monty_tok'); localStorage.removeItem('monty_usr');
  S.token=null; S.user=null; S.master=null;
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  if(msg) say('lmsg', msg);
}

async function bootApp(){

async function loadDash(){
  var box=$('dChart'); if(box) box.innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    var r=await api('getDashboard',{ period:DASH.period, item:DASH.item });
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    var totQ=0, totV=0, maxQ=0;
    r.rows.forEach(function(x){ totQ+=x.qty; totV+=(x.value||0); if(x.qty>maxQ) maxQ=x.qty; });

    $('dStat').innerHTML='<div class="stat">'+
      '<div class="s"><b style="color:var(--orange)">'+r.absensi.hadir+'</b><span>Hadir hari ini</span></div>'+
      '<div class="s"><b style="color:var(--amber)">'+r.absensi.belumPulang+'</b><span>Belum clock out</span></div>'+
      '<div class="s"><b>'+(r.absensi.telat||0)+'</b><span>Telat</span></div>'+
      (r.canSeeValue
        ? '<div class="s"><b class="val" style="font-size:16px">'+rp(totV)+'</b><span>Wastage '+(DASH.period==='week'?'minggu ini':'bulan ini')+'</span></div>'
        : '<div class="s"><b>'+nf(totQ)+'</b><span>Qty wastage '+(DASH.period==='week'?'minggu ini':'bulan ini')+'</span></div>')+
      '<div class="s"><b style="font-size:14px">'+fmtTglShort(r.lastSO)+'</b><span>SO terakhir</span></div>'+
      '<div class="s"><b style="font-size:14px">'+fmtTglShort(r.lastInbound)+'</b><span>Inbound terakhir</span></div>'+
      '</div>';

    if(!totQ){ box.innerHTML='<div class="empty"><div class="ei">🎉</div><div>Belum ada wastage di periode ini</div></div>'; return; }
    var bars=r.rows.map(function(x){
      var h = maxQ? Math.max(3, Math.round(x.qty/maxQ*100)) : 3;
      var tip = fmtTglShort(x.date)+' · '+nf(x.qty)+(r.unit?(' '+r.unit):'')+(x.value!=null?(' · '+rp(x.value)):'');
      return '<div title="'+esc(tip)+'" style="flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px">'+
        '<div style="width:70%;max-width:22px;height:'+h+'%;background:'+(x.qty?'var(--orange)':'#EFE6DC')+';border-radius:5px 5px 0 0"></div>'+
        '</div>';
    }).join('');
    box.innerHTML='<div style="display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0;border-bottom:1.5px solid var(--line)">'+bars+'</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">'+
        '<span>'+fmtTglShort(r.rows[0]&&r.rows[0].date)+'</span><span>'+fmtTglShort(r.rows[r.rows.length-1]&&r.rows[r.rows.length-1].date)+'</span></div>'+
      '<div style="margin-top:12px;padding:11px 13px;background:#FFFBF4;border-radius:12px;display:flex;justify-content:space-between;align-items:center">'+
        '<span style="font-size:12.5px;font-weight:600;color:var(--muted)">Total periode</span>'+
        '<span style="font-weight:700">'+nf(totQ)+(r.unit?(' '+esc(r.unit)):' unit')+(r.canSeeValue?(' · <span class="val">'+rp(totV)+'</span>'):'')+'</span></div>';
  }catch(e){ if(box) box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

var CAM={ stream:null, shot:null, type:null };

async function pgAbsensi(v){

    '<div id="absBody"><div class="empty"><span class="spin"></span></div></div></div>';

async function loadAbsensi(){
  stopCam();
  var b=$('absBody');

    var r=await api('getAbsensiToday',{ date:S.today });
    var d=r.data||{};
    var html='<div class="stat" style="margin-bottom:14px">'+
      '<div class="s"><b style="color:'+(d.masuk?'var(--ok)':'var(--muted)')+'">'+(d.masuk||'—')+'</b><span>Clock In</span></div>'+
      '<div class="s"><b style="color:'+(d.pulang?'var(--orange)':'var(--muted)')+'">'+(d.pulang||'—')+'</b><span>Clock Out</span></div>'+
      '</div>';

    if(d.masuk && d.pulang){
      html+='<div class="msg show ok">✅ Absensi hari ini lengkap. Terima kasih!</div>'+
        '<div class="row" style="margin-top:12px">'+
        (d.fotoMasuk?'<div>'+imgTag(d.fotoMasuk)+'<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">Masuk '+d.masuk+'</div></div>':'')+
        (d.fotoPulang?'<div>'+imgTag(d.fotoPulang)+'<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">Pulang '+d.pulang+'</div></div>':'')+
        '</div>';
    } else {
      var type = d.masuk ? 'out' : 'in';
      var lbl  = d.masuk ? '🌇 Clock Out' : '🌅 Clock In';
      html+='<div style="font-size:13.5px;font-weight:700;margin-bottom:9px">'+lbl+'</div>'+
        '<div class="cam" id="camBox"><div class="ph">Ketuk "Nyalakan Kamera" untuk mulai</div></div>'+
        '<div class="row" style="margin-top:10px">'+
          '<button class="btn ghost sm" style="flex:1" onclick="startCam()">📷 Nyalakan Kamera</button>'+
          '<button class="btn amber sm" style="flex:1" id="snapBtn" onclick="snap()" disabled>Ambil Selfie</button>'+
        '</div>'+
        '<button class="btn" style="margin-top:10px" id="absSave" onclick="saveClock(\''+type+'\')" disabled>Simpan '+(type==='in'?'Clock In':'Clock Out')+'</button>'+
        '<div class="msg" id="absMsg"></div>';
      if(d.masuk && d.fotoMasuk){
        html+='<div style="margin-top:14px"><div class="sec">Foto clock in</div>'+imgTag(d.fotoMasuk)+'</div>';
      }
    }
    b.innerHTML=html;
    CAM.shot=null; CAM.type=null;
  }catch(e){ b.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

async function startCam(){
  var box=$('camBox'); if(!box) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    box.innerHTML='<div class="ph">Browser tidak mendukung kamera. Buka lewat Chrome/Safari terbaru dan pastikan situs diakses via HTTPS.</div>'; return;
  }
  box.innerHTML='<div class="ph"><span class="spin"></span><br>Menyalakan kamera…</div>';
  try{
    stopCam();
    CAM.stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:960} }, audio:false });
    box.innerHTML='<video id="camVid" playsinline autoplay muted></video>';
    var vid=$('camVid'); vid.srcObject=CAM.stream; await vid.play();
    $('snapBtn').disabled=false;
  }catch(e){
    box.innerHTML='<div class="ph">Gagal membuka kamera.<br>Izinkan akses kamera di pengaturan browser, lalu coba lagi.</div>';
  }
}
window.startCam=startCam;

function stopCam(){
  if(CAM.stream){ CAM.stream.getTracks().forEach(function(t){ t.stop(); }); CAM.stream=null; }
}

function snap(){
  var vid=$('camVid'); if(!vid) return;
  var w=vid.videoWidth, h=vid.videoHeight;
  if(!w||!h) return;
  var m=900; if(w>h && w>m){ h=Math.round(h*m/w); w=m; } else if(h>m){ w=Math.round(w*m/h); h=m; }
  var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(vid,0,0,w,h);
  CAM.shot=cv.toDataURL('image/jpeg',0.55);
  stopCam();
  $('camBox').innerHTML='<img src="'+CAM.shot+'">';
  $('snapBtn').disabled=true;
  $('absSave').disabled=false;
}
window.snap=snap;

function getPos(){
  return new Promise(function(resolve){
    if(!navigator.geolocation) return resolve({});
    var done=false;
    navigator.geolocation.getCurrentPosition(
      function(p){ if(!done){ done=true; resolve({ lat:p.coords.latitude, lng:p.coords.longitude }); } },
      function(){ if(!done){ done=true; resolve({}); } },
      { enableHighAccuracy:true, timeout:6000, maximumAge:60000 });
    setTimeout(function(){ if(!done){ done=true; resolve({}); } }, 6500);
  });
}

async function saveClock(type){
  if(!CAM.shot){ say('absMsg','Ambil selfie dulu ya'); return; }
  var btn=$('absSave'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Menyimpan…';
  hideMsg('absMsg');
  try{
    var pos=await getPos();
    var r=await api('clock',{ type:type, date:S.today, photo:CAM.shot, lat:pos.lat, lng:pos.lng });
    if(!r.ok){ say('absMsg', r.msg||'Gagal menyimpan'); btn.disabled=false; btn.textContent='Simpan'; return; }
    CAM.shot=null;
    await loadAbsensi();
    say('absMsg','✅ '+r.msg, true);
  }catch(e){
    say('absMsg', e.message);
    btn.disabled=false; btn.textContent='Simpan';
  }
}
window.saveClock=saveClock;

  var items=S.master.wastageItems||[];
  v.innerHTML='<div class="card"><div class="ctitle">🗑️ Input Wastage</div>'+
    '<div class="fg"><label>Tanggal</label><input type="date" id="wiDate" value="'+S.today+'" max="'+S.today+'"></div>'+
    '<div class="fg"><label>Item</label><select id="wiItem" onchange="wiUnit()">'+
      '<option value="">— pilih item —</option>'+
      items.map(function(i){ return '<option value="'+esc(i.name)+'" data-u="'+esc(i.unit)+'">'+esc(i.name)+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="row"><div class="fg"><label>Qty</label><input type="number" id="wiQty" inputmode="decimal" step="any" min="0" placeholder="0"></div>'+
    '<div class="fg"><label>Unit</label><input type="text" id="wiUnitTxt" readonly placeholder="—"></div></div>'+
    '<div class="fg"><label>Alasan</label><select id="wiReason">'+
      (S.master.reasons||[]).map(function(r){ return '<option>'+esc(r)+'</option>'; }).join('')+
    '</select></div>'+
    '<div class="fg"><label>Foto bukti (wajib)</label>'+
      '<input type="file" id="wiFile" accept="image/*" capture="environment" style="display:none" onchange="wiPhoto(this)">'+
      '<button class="btn ghost" onclick="document.getElementById(\'wiFile\').click()">📷 Ambil / Pilih Foto</button>'+
      '<div id="wiPrev" style="margin-top:10px"></div></div>'+
    '<button class="btn" id="wiSave" onclick="saveWastage()">Simpan Wastage</button>'+
    '<div class="msg" id="wiMsg"></div></div>';
  WST.photo=null;
}
function wiUnit(){
  var s=$('wiItem'); var o=s.options[s.selectedIndex];
  $('wiUnitTxt').value = o ? (o.dataset.u||'') : '';
}
window.wiUnit=wiUnit;

async function wiPhoto(inp){
  var f=inp.files[0]; if(!f) return;
  $('wiPrev').innerHTML='<span class="spin"></span> Memproses foto…';
  try{
    WST.photo=await compress(f, 900, 0.5);
    $('wiPrev').innerHTML='<img class="photo" src="'+WST.photo+'">';
  }catch(e){ $('wiPrev').innerHTML='<span style="color:var(--err);font-size:12.5px">'+esc(e.message)+'</span>'; }
}
window.wiPhoto=wiPhoto;

async function saveWastage(){
  var item=$('wiItem').value, qty=$('wiQty').value;
  if(!item){ say('wiMsg','Pilih item dulu'); return; }
  if(!(Number(qty)>0)){ say('wiMsg','Qty harus lebih dari 0'); return; }
  if(!WST.photo){ say('wiMsg','Foto bukti wajib'); return; }
  var b=$('wiSave'); b.disabled=true; b.innerHTML='<span class="spin"></span> Menyimpan…';
  try{
    var r=await api('submitWastage',{
      date:$('wiDate').value, item:item, unit:$('wiUnitTxt').value,
      qty:Number(qty), reason:$('wiReason').value, photo:WST.photo });
    if(!r.ok){ say('wiMsg', r.msg||'Gagal'); return; }
    say('wiMsg','✅ '+r.msg, true);
    $('wiQty').value=''; $('wiItem').value=''; $('wiUnitTxt').value='';
    $('wiPrev').innerHTML=''; WST.photo=null;
    window.scrollTo(0, document.body.scrollHeight);
  }catch(e){ say('wiMsg', e.message); }
  finally{ b.disabled=false; b.textContent='Simpan Wastage'; }
}
window.saveWastage=saveWastage;

/* ==================================================================
   5. STOCK OPNAME
   ================================================================== */
async function pgSO(v){
  if(S.user.role==='Staff'){ renderSOInput(v); return; }
  v.innerHTML='<div class="card tight"><div class="ctitle">📦 Hasil Stock Opname</div>'+
    '<div class="fg"><label>Tanggal</label><select id="soDate" onchange="loadSOView()"><option>Memuat…</option></select></div>'+
    '</div><div id="soBox"></div>';
  loadSOView(true);
}

async function loadSOView(first){
  var box=$('soBox'); box.innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    var params = first? {} : { date:$('soDate').value };
    var r=await api('getSO', params);
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    if(first){
      $('soDate').innerHTML = (r.dates.length? r.dates : [r.date]).map(function(d){
        return '<option value="'+d+'"'+(d===r.date?' selected':'')+'>'+fmtTgl(d)+'</option>'; }).join('');
    }
    if(!r.rows.length){ box.innerHTML='<div class="card"><div class="empty"><div class="ei">📦</div><div>Belum ada data SO untuk tanggal ini</div></div></div>'; return; }
    box.innerHTML='<div class="card tight">'+
      (r.canSeeValue?'<div style="display:flex;justify-content:space-between;align-items:center;background:#FFFBF4;border-radius:12px;padding:11px 13px;margin-bottom:11px">'+
        '<span style="font-size:12.5px;font-weight:600;color:var(--muted)">Total nilai stok</span><b class="val">'+rp(r.totalValue)+'</b></div>':'')+
      '<div class="tw"><table><thead><tr><th>Item</th><th class="num">Qty</th>'+(r.canSeeValue?'<th class="num">Nilai</th>':'')+'</tr></thead><tbody>'+
      r.rows.map(function(x){
        return '<tr><td style="font-weight:600">'+esc(x.item)+'</td>'+
          '<td class="num qty">'+nf(x.qty)+' <small style="color:var(--muted);font-weight:500">'+esc(x.unit||'')+'</small></td>'+
          (r.canSeeValue?'<td class="num val">'+rp(x.value)+'</td>':'')+'</tr>';
      }).join('')+'</tbody></table></div>'+
      '<div style="font-size:11.5px;color:var(--muted);margin-top:9px">'+r.rows.length+' item ter-opname pada '+fmtTgl(r.date)+'</div></div>';
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
window.loadSOView=loadSOView;

var SOIN={ rows:[] };
async function renderSOInput(v){
  v.innerHTML='<div class="card tight"><div class="ctitle">📦 Input Stock Opname</div>'+
    '<div class="note">Isi jumlah stok <b>fisik</b> yang kamu hitung. Item yang dikosongkan tidak akan disimpan (bukan berarti nol). Kalau stok memang habis, tulis <b>0</b>.</div>'+
    '<div class="fg"><label>Tanggal</label><input type="date" id="soiDate" value="'+S.today+'" max="'+S.today+'" onchange="loadSODraft()"></div>'+
    '<input type="text" id="soiSearch" placeholder="🔍 Cari item…" oninput="filterList(\'soi\')">'+
    '</div><div id="soiBox"><div class="empty"><span class="spin"></span></div></div>';
  loadSODraft();
}

async function loadSODraft(){
  var box=$('soiBox'); box.innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    var r=await api('getSODraft',{ date:$('soiDate').value });
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    SOIN.rows=r.rows;
    if(!r.rows.length){
      box.innerHTML='<div class="card"><div class="empty"><div class="ei">📋</div><div>Master item masih kosong.<br>Isi sheet <b>ITEMS</b> di spreadsheet dulu.</div></div></div>';
      return;
    }
    box.innerHTML='<div class="ilist" id="soiList">'+
      r.rows.map(function(x,i){
        return '<div class="irow'+(x.qty!==''?' filled':'')+'" data-nm="'+esc(String(x.name).toLowerCase())+'" data-i="'+i+'">'+
          '<div class="nm">'+esc(x.name)+'<small>'+esc(x.unit||'—')+(x.cat?(' · '+esc(x.cat)):'')+'</small></div>'+
          '<input type="number" inputmode="decimal" step="any" min="0" value="'+(x.qty===''?'':x.qty)+'" '+
            'oninput="markFilled(this)" placeholder="—"></div>';
      }).join('')+'</div>'+
      '<div class="stickybar"><span class="cnt" id="soiCnt">—</span>'+
        '<button class="btn sm" id="soiSave" onclick="saveSO()">Simpan SO</button></div>'+
      '<div class="msg" id="soiMsg"></div>';
    updCount('soi');
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
window.loadSODraft=loadSODraft;

function markFilled(inp){
  inp.closest('.irow').classList.toggle('filled', inp.value!=='');
  updCount('soi');
}
window.markFilled=markFilled;

function filterList(pfx){
  var q=$(pfx+'Search').value.trim().toLowerCase();
  var list=$(pfx+'List'); if(!list) return;
  Array.prototype.forEach.call(list.children,function(el){
    el.style.display = (!q || el.dataset.nm.indexOf(q)>=0) ? '' : 'none';
  });
}
window.filterList=filterList;

function collect(pfx, rows){
  var list=$(pfx+'List'); var out=[];
  if(!list) return out;
  Array.prototype.forEach.call(list.children,function(el){
    var i=Number(el.dataset.i);
    var val=el.querySelector('input').value;
    if(val==='') return;
    out.push({ name:rows[i].name, unit:rows[i].unit, qty:Number(val) });
  });
  return out;
}

function updCount(pfx){
  var rows = pfx==='soi'? SOIN.rows : INB.rows;
  var n=collect(pfx, rows).length;
  var el=$(pfx+'Cnt');
  if(el) el.textContent = n+' / '+rows.length+' item terisi';
}

async function saveSO(){
  var items=collect('soi', SOIN.rows);
  if(!items.length){ say('soiMsg','Belum ada item yang diisi'); return; }
  if(!confirm('Simpan stock opname '+items.length+' item untuk tanggal '+fmtTgl($('soiDate').value)+'?')) return;
  var b=$('soiSave'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  try{
    var r=await api('saveSO',{ date:$('soiDate').value, items:items });
    say('soiMsg', (r.ok?'✅ ':'')+r.msg, r.ok);
    if(r.ok) loadSODraft();
  }catch(e){ say('soiMsg', e.message); }
  finally{ b.disabled=false; b.textContent='Simpan SO'; }
}
window.saveSO=saveSO;

/* ==================================================================
   6. INBOUND
   ================================================================== */
var INB={ rows:[] };

async function pgInbound(v){
  if(S.user.role==='Staff'){ renderInbInput(v); return; }
  v.innerHTML='<div class="card tight"><div class="ctitle">🚚 Barang Masuk</div>'+
    '<div class="fg"><label>Tanggal</label><select id="inDate" onchange="loadInView()"><option>Memuat…</option></select></div>'+
    '</div><div id="inBox"></div>';
  loadInView(true);
}

var INVIEW=null;
async function loadInView(first){
  var box=$('inBox'); box.innerHTML='<div class="empty"><span class="spin"></span></div>';
  try{
    var r=await api('getInbound', first? {} : { date:$('inDate').value });
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    INVIEW=r;
    if(first){
      $('inDate').innerHTML=(r.dates.length? r.dates : [r.date]).map(function(d){
        return '<option value="'+d+'"'+(d===r.date?' selected':'')+'>'+fmtTgl(d)+'</option>'; }).join('');
    }
    if(!r.rows.length){ box.innerHTML='<div class="card"><div class="empty"><div class="ei">🚚</div><div>Belum ada barang masuk pada tanggal ini</div></div></div>'; return; }
    box.innerHTML='<div class="card tight">'+
      (r.canSeeValue?'<div style="display:flex;justify-content:space-between;align-items:center;background:#FFFBF4;border-radius:12px;padding:11px 13px;margin-bottom:11px">'+
        '<span style="font-size:12.5px;font-weight:600;color:var(--muted)">Total nilai barang masuk</span><b class="val">'+rp(r.totalValue)+'</b></div>':'')+
      '<div class="tw"><table><thead><tr><th>Item</th><th class="num">Qty</th>'+(r.canSeeValue?'<th class="num">Nilai</th>':'')+'<th></th></tr></thead><tbody>'+
      r.rows.map(function(x,i){
        return '<tr><td style="font-weight:600">'+esc(x.item)+'</td>'+
          '<td class="num qty">'+nf(x.qty)+' <small style="color:var(--muted);font-weight:500">'+esc(x.unit||'')+'</small></td>'+
          (r.canSeeValue?'<td class="num val">'+rp(x.value)+'</td>':'')+
          '<td class="num">'+(x.entries&&x.entries.length?'<a href="javascript:;" onclick="inbDetail('+i+')">'+x.entries.length+' ›</a>':'—')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
window.loadInView=loadInView;

function inbDetail(i){
  var x=INVIEW.rows[i];
  openModal(esc(x.item),
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:11px">'+fmtTgl(INVIEW.date)+' · total '+nf(x.qty)+' '+esc(x.unit||'')+'</div>'+
    x.entries.map(function(e){
      return '<div style="border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px">'+
        '<div style="display:flex;justify-content:space-between;gap:10px"><b>'+nf(e.qty)+' '+esc(x.unit||'')+'</b>'+
        '<span style="font-size:12px;color:var(--muted)">'+esc(e.time)+'</span></div>'+
        '<div style="font-size:12.5px;margin-top:5px">'+esc(e.source||'—')+(e.sj?(' · SJ '+esc(e.sj)):'')+'</div>'+
        (e.note?'<div style="font-size:12px;color:var(--muted);margin-top:3px">'+esc(e.note)+'</div>':'')+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:5px">oleh '+esc(e.by)+'</div></div>';
    }).join(''));
}
window.inbDetail=inbDetail;

function renderInbInput(v){
  var items=S.master.items||[];
  INB.rows=items.map(function(x){ return { name:x.name, unit:x.unit, cat:x.cat }; });
  v.innerHTML='<div class="card tight"><div class="ctitle">🚚 Input Barang Masuk</div>'+
    '<div class="note">Isi qty barang yang <b>benar-benar diterima</b>. Item yang dikosongkan dianggap tidak ada kiriman. Kalau ada 2 kiriman di hari yang sama, simpan dua kali — qty otomatis ditambahkan.</div>'+
    '<div class="fg"><label>Tanggal terima</label><input type="date" id="inbDate" value="'+S.today+'" max="'+S.today+'"></div>'+
    '<div class="row"><div class="fg"><label>Sumber</label><select id="inbSource">'+
      (S.master.sources||[]).map(function(s){ return '<option>'+esc(s)+'</option>'; }).join('')+'</select></div>'+
    '<div class="fg"><label>No. Surat Jalan</label><input type="text" id="inbSJ" placeholder="opsional"></div></div>'+
    '<div class="fg"><label>Catatan</label><input type="text" id="inbNote" placeholder="opsional — mis. 1 dus penyok"></div>'+
    '<input type="text" id="inbSearch" placeholder="🔍 Cari item…" oninput="filterList(\'inb\')">'+
    '</div>'+
    (items.length
      ? '<div class="ilist" id="inbList">'+
        items.map(function(x,i){
          return '<div class="irow" data-nm="'+esc(String(x.name).toLowerCase())+'" data-i="'+i+'">'+
            '<div class="nm">'+esc(x.name)+'<small>'+esc(x.unit||'—')+(x.cat?(' · '+esc(x.cat)):'')+'</small></div>'+
            '<input type="number" inputmode="decimal" step="any" min="0" oninput="markFilledInb(this)" placeholder="—"></div>';
        }).join('')+'</div>'+
        '<div class="stickybar"><span class="cnt" id="inbCnt">0 / '+items.length+' item terisi</span>'+
        '<button class="btn sm" id="inbSave" onclick="saveInbound()">Simpan</button></div>'+
        '<div class="msg" id="inbMsg"></div>'
      : '<div class="card"><div class="empty"><div class="ei">📋</div><div>Master item masih kosong.<br>Isi sheet <b>ITEMS</b> di spreadsheet dulu.</div></div></div>');
}

function markFilledInb(inp){
  inp.closest('.irow').classList.toggle('filled', inp.value!=='' && Number(inp.value)>0);
  updCount('inb');
}
window.markFilledInb=markFilledInb;

async function saveInbound(){
  var items=collect('inb', INB.rows).filter(function(x){ return x.qty>0; });
  if(!items.length){ say('inbMsg','Belum ada qty yang diisi'); return; }
  if(!confirm('Simpan '+items.length+' item barang masuk tanggal '+fmtTgl($('inbDate').value)+'?')) return;
  var b=$('inbSave'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  try{
    var r=await api('saveInbound',{
      date:$('inbDate').value, items:items,
      source:$('inbSource').value, suratJalan:$('inbSJ').value.trim(), note:$('inbNote').value.trim() });
    say('inbMsg',(r.ok?'✅ ':'')+r.msg, r.ok);
    if(r.ok){
      Array.prototype.forEach.call($('inbList').children,function(el){
        el.querySelector('input').value=''; el.classList.remove('filled'); });
      $('inbSJ').value=''; $('inbNote').value='';
      updCount('inb');
    }
  }catch(e){ say('inbMsg', e.message); }
  finally{ b.disabled=false; b.textContent='Simpan'; }
}
window.saveInbound=saveInbound;

/* ==================================================================
   BOOT
   ================================================================== */
(async function(){
  var t=localStorage.getItem('monty_tok');
  if(!t) return;
  S.token=t;
  try{ S.user=JSON.parse(localStorage.getItem('monty_usr')||'null'); }catch(e){}
  try{ await bootApp(); }catch(e){ forceLogout(''); }
})();
window.addEventListener('pagehide', stopCam);
</script>
