<style>
:root{
  --orange:#E94E1E; --amber:#F8AD35; --amber-l:#FFF1D9;
  --cream:#FFF8F0; --card:#fff; --ink:#2B2320; --muted:#8A7F79; --line:#F0E2D4;
  --ok:#1B9C64; --ok-bg:#E7F6EF; --err:#D3392B; --err-bg:#FDECEA; --blue:#2E6BB8; --blue-bg:#EAF1F8;
  --sh:0 8px 22px rgba(120,80,40,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
a{color:var(--orange);cursor:pointer}
.hidden{display:none!important}

#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1100px 500px at 50% -10%,#FFE7D2 0%,var(--cream) 60%)}
.lbox{width:100%;max-width:380px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px}
.brand img{width:76px;height:76px;border-radius:22px;object-fit:cover;box-shadow:0 10px 26px rgba(233,78,30,.25)}
.brand h1{margin:6px 0 0;font-size:22px;font-weight:700;letter-spacing:-.3px}
.brand small{color:var(--muted);font-size:12.5px;font-weight:500}

header{position:sticky;top:0;z-index:20;background:rgba(255,248,240,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:9px 13px;display:flex;align-items:center;gap:9px}
header img{width:33px;height:33px;border-radius:11px;object-fit:cover;flex:none}
header .ht{flex:1;min-width:0}
header .ht b{display:block;font-size:14.5px;font-weight:700;line-height:1.15}
header .ht span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--amber-l);color:#8A5B00;flex:none}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:11px;width:35px;height:35px;flex:none;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
main{max-width:640px;margin:0 auto;padding:13px 13px 100px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:5px 3px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(120,80,40,.06)}
nav button{flex:1;border:none;background:none;padding:7px 1px;border-radius:12px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600}
nav button i{font-style:normal;font-size:18px;line-height:1}
nav button.on{color:var(--orange);background:#FFF1EC}
nav .dot{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;
  background:var(--orange);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:13px}
.card.tight{padding:13px}
.ctitle{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sec{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px}
label{display:block;font-weight:600;font-size:12.5px;margin:0 0 5px;color:#5d514b}
.fg{margin-bottom:11px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(248,173,53,.18)}
textarea{resize:vertical;min-height:60px}
.btn{width:100%;padding:13px;border:none;border-radius:13px;background:var(--orange);color:#fff;
  font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(233,78,30,.24)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.amber{background:var(--amber);color:#4a3000;box-shadow:0 6px 16px rgba(248,173,53,.28)}
.btn.ghost{background:#fff;color:var(--orange);border:1.5px solid var(--orange);box-shadow:none}
.btn.green{background:var(--ok);box-shadow:0 6px 16px rgba(27,156,100,.24)}
.btn.red{background:var(--err);box-shadow:0 6px 16px rgba(211,57,43,.22)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.msg{margin-top:10px;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:500;display:none}
.msg.show{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.err{background:var(--err-bg);color:var(--err)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;border:1.5px solid var(--line);background:#fff;color:var(--muted);
  padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:700;font-size:11.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.3px;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #F7EEE4;vertical-align:top}
tr:last-child td{border-bottom:none}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.qty{font-weight:700;color:var(--orange)}
.val{font-weight:700;color:#1B7A4B}
.empty{text-align:center;padding:30px 14px;color:var(--muted);font-size:13.5px}
.empty .ei{font-size:32px;margin-bottom:8px}
.spin{display:inline-block;width:17px;height:17px;border:2.5px solid var(--line);border-top-color:var(--orange);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-pend{background:var(--amber-l);color:#8A5B00}
.b-no{background:var(--err-bg);color:var(--err)}
.b-off{background:#F2EDE8;color:var(--muted)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:9px}
.stat .s{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.stat .s b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.stat .s span{font-size:11px;color:var(--muted);font-weight:600}
.note{font-size:12px;color:var(--muted);background:#FFFDF8;border-left:3px solid var(--amber);
  border-radius:9px;padding:9px 11px;line-height:1.5;margin-bottom:12px}
.cam{position:relative;width:100%;aspect-ratio:3/4;max-height:280px;background:#181310;border-radius:15px;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.cam video,.cam img{width:100%;height:100%;object-fit:cover}
.cam .ph{color:#8b8078;font-size:12.5px;padding:16px;text-align:center}
.photo{width:100%;border-radius:13px;max-height:220px;object-fit:cover}
.mtx{overflow:auto;-webkit-overflow-scrolling:touch;max-height:68vh;
  border:1px solid var(--line);border-radius:14px;background:#fff}
.mtx table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:auto;min-width:100%}
.mtx th,.mtx td{border-bottom:1px solid #F7EEE4;padding:6px 8px;white-space:nowrap;background:#fff}
.mtx thead th{position:sticky;top:0;z-index:3;background:#FFF3E9;color:#7a6a60;
  font-size:11px;font-weight:700;text-transform:none;letter-spacing:0;text-align:center;
  border-bottom:1.5px solid var(--line)}
.mtx thead th.cnr{left:0;z-index:5;text-align:left}
.mtx tbody td.dt{position:sticky;left:0;z-index:2;font-weight:600;font-size:12px;
  border-right:1.5px solid var(--line)}
.mtx tbody tr.alt td{background:#FFFCF7}
.mtx tbody tr.today td{background:#FFF4EC}
.cellv{cursor:pointer;text-align:center;min-width:76px;line-height:1.3}
.cellv .ci{font-weight:600;color:var(--ok)}
.cellv .co{font-weight:600;color:var(--orange)}
.cellv .pend{color:var(--amber);font-weight:600;font-size:11px}
.cellv .no{color:#DCD0C6}
.cellv .kode{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:7px}
.k-sakit{background:#FDECEA;color:#C0392B}
.k-al{background:#E7F6EF;color:#15804F}
.k-upl{background:#F2EDE8;color:#6b5f57}
.k-lain{background:#EAF1F8;color:#2E6BB8}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend b{font-weight:700;color:var(--ink)}
.rq{border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:9px;background:#fff}
.rq .top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px;margin-bottom:5px}
.rq .top b{font-size:14px}
.rq .meta{font-size:12px;color:var(--muted);line-height:1.5}
.ilist{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.irow{padding:10px 11px;border-bottom:1px solid #F7EEE4}
.irow:last-child{border-bottom:none}
.irow.filled{background:#FFFBF4}
.irow .nm{font-size:13.5px;font-weight:600;line-height:1.25;margin-bottom:7px}
.irow .nm small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:1px}
.irow .qf{display:flex;gap:8px}
.irow .qf .f{flex:1;min-width:0;display:flex;align-items:center;gap:6px;
  border:1.5px solid var(--line);border-radius:11px;padding:0 9px 0 0;background:#fff}
.irow .qf .f:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(248,173,53,.18)}
.irow .qf .f input{flex:1;min-width:0;width:100%;border:none;background:none;padding:9px 4px 9px 9px;
  text-align:right;font-size:14px;outline:none;box-shadow:none}
.irow .qf .f span{flex:none;font-size:11.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.irow .qf .f .cap{position:absolute}
.irow .tot{font-size:11.5px;color:var(--ok);font-weight:600;margin-top:6px;min-height:1px}
.stickybar{position:sticky;bottom:86px;z-index:10;background:rgba(255,248,240,.96);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:15px;padding:10px 12px;margin-top:12px;display:flex;align-items:center;gap:10px}
.stickybar .cnt{flex:1;font-size:12.5px;font-weight:600;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,20,14,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .mb{background:#fff;width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.modal .mh b{flex:1;font-size:16px;font-weight:700}
@media(min-width:641px){.modal{align-items:center}.modal .mb{border-radius:20px;max-height:82dvh}}
</style>

<script>
/* ==================================================================
   KONFIGURASI
   ================================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbyHr1mvLCX9CqQJ4slpSSRDqiRJRFa1_E5hu8zKUq-BcO2LddvILt4K4Ibhne27ODhFbg/exec';

/* ==================================================================
   UTIL
   ================================================================== */
var S = { token:null, user:null, m:null, page:null, today:'' };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function rp(n){ return 'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID'); }
function nf(n){ var x=Number(n)||0; return (Math.round(x*100)/100).toLocaleString('id-ID'); }
function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function todayISO(){ return iso(new Date()); }
function firstOfMonth(){ var d=new Date(); return iso(new Date(d.getFullYear(),d.getMonth(),1,12)); }
var BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtTgl(s){ if(!s) return '—'; var p=String(s).split('-'); if(p.length<3) return s; return Number(p[2])+' '+BLN[Number(p[1])-1]+' '+p[0]; }
function fmtShort(s){ if(!s) return '—'; var p=String(s).split('-'); return p.length<3?s:(p[2]+'/'+p[1]); }
function say(el,text,ok){ var m=$(el); if(!m) return; m.className='msg show '+(ok?'ok':'err'); m.textContent=text; }
function hideMsg(el){ var m=$(el); if(m) m.className='msg'; }
function loading(){ return '<div class="empty"><span class="spin"></span></div>'; }

/* --- API: POST text/plain → tanpa CORS preflight --- */
async function api(action, params){
  var res = await fetch(API_URL, {
    method:'POST', redirect:'follow',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action:action, token:S.token }, params||{}))
  });
  var txt = await res.text(), j;
  try{ j = JSON.parse(txt); }
  catch(e){ throw new Error('Respons server tidak valid. Cek deployment Apps Script (akses harus "Anyone").'); }
  if(j && j.expired){ forceLogout('Sesi habis, silakan login ulang.'); throw new Error('Sesi habis'); }
  return j;
}

/* --- kompres foto --- */
function compress(file, maxPx, q0){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height,m=maxPx||760;
        if(w>h && w>m){ h=Math.round(h*m/w); w=m; } else if(h>m){ w=Math.round(w*m/h); h=m; }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        var q=q0||0.45, out=cv.toDataURL('image/jpeg',q);
        while(out.length>420000 && q>0.25){ q-=0.07; out=cv.toDataURL('image/jpeg',q); }
        resolve(out);
      };
      img.onerror=function(){ reject(new Error('Gagal membaca gambar')); };
      img.src=e.target.result;
    };
    r.onerror=function(){ reject(new Error('Gagal membaca file')); };
    r.readAsDataURL(file);
  });
}

function openModal(title, html){
  $('modal').innerHTML='<div class="modal" onclick="if(event.target===this)closeModal()"><div class="mb">'+
    '<div class="mh"><b>'+title+'</b><button class="iconbtn" onclick="closeModal()">✕</button></div>'+html+'</div></div>';
}
function closeModal(){ $('modal').innerHTML=''; }
window.closeModal=closeModal;

async function photoFallback(el, url){
  try{
    var m=String(url).match(/[-\w]{25,}/); if(!m) return;
    var r=await api('getPhoto',{ fileId:m[0] });
    if(r && r.ok && r.data) el.src=r.data;
  }catch(e){}
}
window.photoFallback=photoFallback;
function zoomPhoto(url){
  openModal('Foto','<img class="photo" style="max-height:none" src="'+esc(url)+'" onerror="photoFallback(this,\''+esc(url)+'\')">');
}
window.zoomPhoto=zoomPhoto;
function imgTag(url){
  if(!url) return '';
  return '<img class="photo" loading="lazy" style="cursor:zoom-in" src="'+esc(url)+'" '+
         'onclick="zoomPhoto(\''+esc(url)+'\')" onerror="photoFallback(this,\''+esc(url)+'\')">';
}

/* "(2500ml/btl)" — qty per pack, unit, nama full pax */
function packLabel(x){
  if(x.packSize>0 && x.packName) return '('+nf(x.packSize)+esc(x.unit||'')+'/'+esc(x.packName)+')';
  return esc(x.unit||'—');
}
/* 12750 ml, pack 2500/btl -> "5 btl + 250 ml" */
function packBreak(qty, packSize, packName, unit){
  qty=Number(qty)||0;
  if(!(packSize>0) || !packName) return nf(qty)+' '+esc(unit||'');
  var p=Math.floor(qty/packSize), l=qty-p*packSize;
  if(!p) return nf(l)+' '+esc(unit||'');
  return nf(p)+' '+esc(packName)+(l?(' + '+nf(l)+' '+esc(unit||'')):'');
}
/* satu baris input: nama + kolom pack & ceceran */
function itemRow(x, i, pfx){
  var hasPack = x.packSize>0 && x.packName;
  var pv = (x.pack===undefined||x.pack==='')?'':x.pack;
  var lv = (x.loose===undefined||x.loose==='')?'':x.loose;
  var filled = (pv!=='' || lv!=='');
  return '<div class="irow'+(filled?' filled':'')+'" data-nm="'+esc(String(x.name).toLowerCase())+'" data-i="'+i+'">'+
    '<div class="nm">'+esc(x.name)+'<small>'+packLabel(x)+'</small></div>'+
    '<div class="qf">'+
      (hasPack
        ? '<div class="f"><input type="number" class="pk" inputmode="decimal" step="any" min="0" value="'+pv+'" '+
          'oninput="rowChange(this,\''+pfx+'\')" placeholder="0"><span>'+esc(x.packName)+'</span></div>'
        : '')+
      '<div class="f"><input type="number" class="ls" inputmode="decimal" step="any" min="0" value="'+lv+'" '+
        'oninput="rowChange(this,\''+pfx+'\')" placeholder="'+(hasPack?'ceceran':'0')+'"><span>'+esc(x.unit||'')+'</span></div>'+
    '</div><div class="tot"></div></div>';
}

function stBadge(st){
  if(st==='Approved') return '<span class="badge b-ok">Disetujui</span>';
  if(st==='Rejected') return '<span class="badge b-no">Ditolak</span>';
  if(st==='Dibatalkan') return '<span class="badge b-off">Dibatalkan</span>';
  return '<span class="badge b-pend">Menunggu</span>';
}

/* ==================================================================
   AUTH
   ================================================================== */
async function doLogin(){
  var u=$('lu').value.trim(), p=$('lp').value;
  if(!u||!p){ say('lmsg','Username & password wajib diisi'); return; }
  var b=$('lbtn'); b.disabled=true; b.innerHTML='<span class="spin"></span> Masuk…';
  try{
    var r=await api('login',{ username:u, password:p });
    if(!r.ok){ say('lmsg', r.msg||'Login gagal'); return; }
    S.token=r.token; S.user=r.user;
    localStorage.setItem('monty_tok', r.token);
    localStorage.removeItem('monty_init');
    await bootApp();
  }catch(e){ say('lmsg', e.message); }
  finally{ b.disabled=false; b.textContent='Masuk'; }
}
window.doLogin=doLogin;
$('lp').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

async function doLogout(){
  if(!confirm('Keluar dari aplikasi?')) return;
  try{ api('logout',{}).catch(function(){}); }catch(e){}
  forceLogout('');
}
window.doLogout=doLogout;

function forceLogout(msg){
  localStorage.removeItem('monty_tok'); localStorage.removeItem('monty_init');
  S.token=null; S.user=null; S.m=null;
  stopCam();
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  if(msg) say('lmsg', msg);
}

/* ==================================================================
   SHELL — boot pakai cache dulu, refresh di belakang
   ================================================================== */
var NAVS = {
  Staff:   [['absensi','🕐','Absensi'],['wastage','🗑️','Wastage'],['so','📦','Opname'],['inbound','🚚','Inbound']],
  AM:      [['dash','📊','Dashboard'],['absensi','🕐','Absensi'],['wastage','🗑️','Wastage'],['so','📦','Opname'],['inbound','🚚','Inbound']],
  Finance: [['dash','📊','Dashboard'],['absensi','🕐','Absensi'],['wastage','🗑️','Wastage'],['so','📦','Opname'],['inbound','🚚','Inbound']]
};

function applyMaster(m, fromCache){
  S.m=m; S.user=m.user; S.today=m.today||todayISO();
  $('hName').textContent=m.user.name;
  $('hSub').textContent='MONTY&Co. Duri Kosambi · '+fmtTgl(S.today);
  $('hRole').textContent=m.user.role;
  var list=NAVS[m.user.role]||NAVS.Staff;
  $('nav').innerHTML=list.map(function(n){
    var dot = (n[0]==='absensi' && m.pending) ? '<span class="dot" id="navDot">'+m.pending+'</span>' : '';
    return '<button data-p="'+n[0]+'" onclick="go(\''+n[0]+'\')">'+dot+'<i>'+n[1]+'</i>'+n[2]+'</button>';
  }).join('');
  if(!fromCache) try{ localStorage.setItem('monty_init', JSON.stringify(m)); }catch(e){}
  return list;
}

async function bootApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');

  var cached=null;
  try{ cached=JSON.parse(localStorage.getItem('monty_init')||'null'); }catch(e){}
  if(cached && cached.user){
    var list=applyMaster(cached, true);
    go(list[0][0]);                       // tampil instan dari cache
    refreshMaster();                      // segarkan diam-diam
    return;
  }
  $('view').innerHTML='<div class="empty"><span class="spin"></span><div style="margin-top:8px">Memuat…</div></div>';
  var r=await api('init',{});
  if(!r.ok){ forceLogout(r.msg||'Gagal memuat'); return; }
  var l=applyMaster(r,false);
  go(l[0][0]);
}

async function refreshMaster(){
  try{
    var r=await api('init',{});
    if(!r.ok) return;
    var oldToday=S.today;
    var oldPending=S.m?S.m.pending:0;
    var oldAbs=JSON.stringify((S.m&&S.m.absensi)||null);
    applyMaster(r,false);
    if(oldToday!==r.today){ go(S.page); return; }          // ganti hari → render ulang
    if(S.page!=='absensi') return;
    if(r.user.role==='Staff'){
      if(oldAbs!==JSON.stringify(r.absensi||null) && STAB==='absen') renderClock();
    } else if(oldPending!==r.pending){
      go('absensi');
    }
  }catch(e){}
}

function go(page){
  S.page=page;
  Array.prototype.forEach.call($('nav').children,function(b){ b.classList.toggle('on', b.dataset.p===page); });
  window.scrollTo(0,0);
  stopCam();
  var v=$('view'); v.innerHTML=loading();
  ({ dash:pgDash, absensi:pgAbsensi, wastage:pgWastage, so:pgSO, inbound:pgInbound }[page]||pgAbsensi)(v);
}
window.go=go;

function pgDash(v){

    '<div class="card"><div class="ctitle">🗑️ Tren Wastage</div>'+

function dashPeriod(p){ DASH.period=p; $('dp-month').classList.toggle('on',p==='month'); $('dp-week').classList.toggle('on',p==='week'); loadDash(); }
function dashItem(){ DASH.item=$('dItem').value; loadDash(); }
window.dashPeriod=dashPeriod; window.dashItem=dashItem;

async function loadDash(){
  var box=$('dChart'); if(box) box.innerHTML=loading();
  try{
    var r=await api('getDashboard',{ period:DASH.period, item:DASH.item });
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    var totQ=0,totV=0,maxQ=0;
    r.rows.forEach(function(x){ totQ+=x.qty; totV+=(x.value||0); if(x.qty>maxQ) maxQ=x.qty; });
    var per = DASH.period==='week'?'minggu ini':'bulan ini';

    $('dStat').innerHTML='<div class="stat">'+
      '<div class="s"><b style="color:var(--orange)">'+r.absensi.hadir+'<span style="font-size:12px;color:var(--muted);font-weight:600">/'+r.absensi.total+'</span></b><span>Hadir hari ini</span></div>'+
      '<div class="s"><b style="color:var(--amber)">'+r.absensi.belumPulang+'</b><span>Belum clock out</span></div>'+
      '<div class="s"><b style="color:'+(r.pending?'var(--orange)':'var(--muted)')+'">'+r.pending+'</b><span>Perlu persetujuan</span></div>'+
      (r.canSeeValue
        ? '<div class="s"><b class="val" style="font-size:15px">'+rp(totV)+'</b><span>Wastage '+per+'</span></div>'
        : '<div class="s"><b>'+nf(totQ)+'</b><span>Qty wastage '+per+'</span></div>')+
      '<div class="s"><b style="font-size:14px">'+fmtShort(r.lastSO)+'</b><span>SO terakhir</span></div>'+
      '<div class="s"><b style="font-size:14px">'+fmtShort(r.lastInbound)+'</b><span>Inbound terakhir</span></div></div>';

    if(!totQ){ box.innerHTML='<div class="empty"><div class="ei">🎉</div><div>Belum ada wastage di periode ini</div></div>'; return; }
    var bars=r.rows.map(function(x){
      var h=maxQ?Math.max(3,Math.round(x.qty/maxQ*100)):3;
      var tip=fmtShort(x.date)+' · '+nf(x.qty)+(r.unit?(' '+r.unit):'')+(x.value!=null?(' · '+rp(x.value)):'');
      return '<div title="'+esc(tip)+'" style="flex:1;min-width:5px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center">'+
        '<div style="width:72%;max-width:22px;height:'+h+'%;background:'+(x.qty?'var(--orange)':'#EFE6DC')+';border-radius:5px 5px 0 0"></div></div>';
    }).join('');
    box.innerHTML='<div style="display:flex;align-items:flex-end;gap:3px;height:150px;padding:6px 0;border-bottom:1.5px solid var(--line)">'+bars+'</div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">'+
      '<span>'+fmtShort(r.rows[0]&&r.rows[0].date)+'</span><span>'+fmtShort(r.rows[r.rows.length-1]&&r.rows[r.rows.length-1].date)+'</span></div>'+
      '<div style="margin-top:12px;padding:11px 13px;background:#FFFBF4;border-radius:12px;display:flex;justify-content:space-between;align-items:center">'+
      '<span style="font-size:12.5px;font-weight:600;color:var(--muted)">Total periode</span><span style="font-weight:700">'+
      nf(totQ)+(r.unit?(' '+esc(r.unit)):' unit')+(r.canSeeValue?(' · <span class="val">'+rp(totV)+'</span>'):'')+'</span></div>';
  }catch(e){ if(box) box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

var STAB='absen', MYREQ=null;
function staffAbsensi(v){

    ['absen|🕐 Absen','lembur|⏱️ Lembur','izin|📝 Izin','koreksi|🔧 Koreksi'].map(function(x){

function stTab(t){

  if(t==='izin') return renderIzin();

window.stTab=stTab;

// -- clock in / out --
var CAM={ stream:null, shot:null };
function renderClock(){
  var b=$('stBox');
  var d=(S.m && S.m.absensi) || { masuk:'', pulang:'' };
  var html='<div class="card">'+
    '<div class="ctitle">🕐 Absensi Hari Ini</div>'+
    '<div class="note">📸 Selfie <b>wajib langsung dari kamera</b>. Pakai atribut lengkap dan pastikan latar terlihat di lokasi toko. Jam diambil otomatis dari server.</div>'+
    '<div class="stat" style="margin-bottom:13px">'+
    '<div class="s"><b style="color:'+(d.masuk?'var(--ok)':'var(--muted)')+'">'+(d.masuk||'—')+'</b><span>Clock In</span></div>'+
    '<div class="s"><b style="color:'+(d.pulang?'var(--orange)':'var(--muted)')+'">'+(d.pulang||'—')+'</b><span>Clock Out</span></div></div>';

  if(d.masuk && d.pulang){
    html+='<div class="msg show ok">✅ Absensi hari ini lengkap. Terima kasih!</div><div class="row" style="margin-top:12px">'+
      (d.fotoMasuk?'<div>'+imgTag(d.fotoMasuk)+'<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">Masuk '+d.masuk+'</div></div>':'')+
      (d.fotoPulang?'<div>'+imgTag(d.fotoPulang)+'<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">Pulang '+d.pulang+'</div></div>':'')+
      '</div>';
  } else {
    var type=d.masuk?'out':'in';
    html+='<div style="font-size:13.5px;font-weight:700;margin-bottom:9px">'+(d.masuk?'🌇 Clock Out':'🌅 Clock In')+'</div>'+
      '<div class="cam" id="camBox"><div class="ph">Ketuk "Nyalakan Kamera" untuk mulai</div></div>'+
      '<div class="row" style="margin-top:10px">'+
      '<button class="btn ghost sm" style="flex:1" onclick="startCam()">📷 Nyalakan Kamera</button>'+
      '<button class="btn amber sm" style="flex:1" id="snapBtn" onclick="snap()" disabled>Ambil Selfie</button></div>'+
      '<button class="btn" style="margin-top:10px" id="absSave" onclick="saveClock(\''+type+'\')" disabled>Simpan '+(type==='in'?'Clock In':'Clock Out')+'</button>'+
      '<div class="msg" id="absMsg"></div>';
    if(d.masuk && d.fotoMasuk) html+='<div class="sec">Foto clock in</div>'+imgTag(d.fotoMasuk);
  }
  b.innerHTML=html+'</div>';
  CAM.shot=null;
}

async function startCam(){
  var box=$('camBox'); if(!box) return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    box.innerHTML='<div class="ph">Browser tidak mendukung kamera. Buka via Chrome/Safari terbaru dan pastikan alamatnya HTTPS.</div>'; return;
  }
  box.innerHTML='<div class="ph"><span class="spin"></span><br>Menyalakan kamera…</div>';
  try{
    stopCam();
    CAM.stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:960}, height:{ideal:1280} }, audio:false });
    box.innerHTML='<video id="camVid" playsinline autoplay muted></video>';
    var vid=$('camVid'); vid.srcObject=CAM.stream; await vid.play();
    $('snapBtn').disabled=false;
  }catch(e){ box.innerHTML='<div class="ph">Gagal membuka kamera.<br>Izinkan akses kamera di pengaturan browser, lalu coba lagi.</div>'; }
}
window.startCam=startCam;
function stopCam(){ if(CAM.stream){ CAM.stream.getTracks().forEach(function(t){ t.stop(); }); CAM.stream=null; } }

function snap(){
  var vid=$('camVid'); if(!vid) return;
  var w=vid.videoWidth,h=vid.videoHeight; if(!w||!h) return;
  var m=760; if(w>h && w>m){ h=Math.round(h*m/w); w=m; } else if(h>m){ w=Math.round(w*m/h); h=m; }
  var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  cv.getContext('2d').drawImage(vid,0,0,w,h);
  CAM.shot=cv.toDataURL('image/jpeg',0.45);
  stopCam();
  $('camBox').innerHTML='<img src="'+CAM.shot+'">';
  $('snapBtn').disabled=true; $('absSave').disabled=false;
}
window.snap=snap;

function getPos(){
  return new Promise(function(resolve){
    if(!navigator.geolocation) return resolve({});
    var done=false;
    navigator.geolocation.getCurrentPosition(
      function(p){ if(!done){done=true;resolve({lat:p.coords.latitude,lng:p.coords.longitude});} },
      function(){ if(!done){done=true;resolve({});} },
      { enableHighAccuracy:true, timeout:5000, maximumAge:60000 });
    setTimeout(function(){ if(!done){done=true;resolve({});} },5200);
  });
}

async function saveClock(type){
  if(!CAM.shot){ say('absMsg','Ambil selfie dulu ya'); return; }
  var btn=$('absSave'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Menyimpan…';
  hideMsg('absMsg');
  try{
    var pos=await getPos();
    var r=await api('clock',{ type:type, photo:CAM.shot, lat:pos.lat, lng:pos.lng });
    if(!r.ok){ say('absMsg', r.msg||'Gagal'); btn.disabled=false;
      btn.textContent='Simpan '+(type==='in'?'Clock In':'Clock Out'); return; }
    CAM.shot=null;
    S.m.absensi=r.data;
    try{ localStorage.setItem('monty_init', JSON.stringify(S.m)); }catch(e){}
    renderClock();
    say('absMsg','✅ '+r.msg, true);
  }catch(e){ say('absMsg', e.message); btn.disabled=false;
    btn.textContent='Simpan '+(type==='in'?'Clock In':'Clock Out'); }
}
window.saveClock=saveClock;

// -- riwayat pengajuan --
async function myReq(force){
  if(MYREQ && !force) return MYREQ;
  MYREQ=await api('getMyRequests',{});
  return MYREQ;
}
function reqCard(type, r){
  var head, meta;
  if(type==='ot'){ head=r.hours+' jam · '+fmtTgl(r.date); meta=esc(r.reason); }
  else if(type==='izin'){ head=esc(r.jenis); meta=fmtTgl(r.date)+(r.to&&r.to!==r.date?(' – '+fmtTgl(r.to)):'')+'<br>'+esc(r.keterangan); }
  else { head=(r.tipe==='in'?'Jam Masuk':'Jam Pulang')+' → '+r.jam; meta=fmtTgl(r.date)+'<br>'+esc(r.reason); }
  return '<div class="rq"><div class="top"><b>'+head+'</b>'+stBadge(r.status)+'</div>'+
    '<div class="meta">'+meta+
    (r.status==='Rejected'&&r.tolak?('<br><span style="color:var(--err)">Ditolak: '+esc(r.tolak)+'</span>'):'')+
    (r.status==='Approved'&&r.by?('<br><span style="color:var(--ok)">Disetujui '+esc(r.by)+'</span>'):'')+'</div>'+
    (r.photo?('<div style="margin-top:9px">'+imgTag(r.photo)+'</div>'):'')+
    (r.status==='Pending'?('<button class="btn ghost sm" style="margin-top:9px" onclick="cancelReq(\''+type+'\','+r.row+')">Batalkan</button>'):'')+
    '</div>';
}
async function cancelReq(type,row){
  if(!confirm('Batalkan pengajuan ini?')) return;
  try{
    var r=await api('cancelRequest',{ type:type, row:row });
    if(!r.ok){ alert(r.msg); return; }
    MYREQ=null; stTab(STAB);
  }catch(e){ alert(e.message); }
}
window.cancelReq=cancelReq;

async function submitOT(){

    var r=await api('submitOvertime',{ date:$('otDate').value, hours:$('otJam').value, reason:$('otAlasan').value.trim() });

/* kode singkat izin di matriks */
var IZKODE = {
  'Izin Sakit':   ['SAKIT','k-sakit'],
  'Cuti Tahunan': ['AL','k-al'],
  'Unpaid Leave': ['UPL','k-upl'],
  'Izin Lainnya': ['IZIN LAIN','k-lain']
};
function izKode(jenis){
  return IZKODE[jenis] || [String(jenis||'IZIN').toUpperCase(), 'k-lain'];
}
function dateRange(from,to){
  var out=[], d=new Date(from+'T12:00:00'), end=new Date(to+'T12:00:00');
  while(d<=end && out.length<400){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}

async function loadCA(){
  var box=$('caBox'); box.innerHTML=loading();
  try{
    var r=await api('getAbsensi',{ from:$('caFrom').value, to:$('caTo').value });
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    CA=r;

    /* --- daftar staff: gabungkan USERS aktif + siapa pun yang punya data --- */
    var people={};
    (r.staff||[]).forEach(function(x){ people[x.username.toLowerCase()]={ username:x.username, name:x.name }; });
    (r.data||[]).forEach(function(x){ var k=x.username.toLowerCase();
      if(!people[k]) people[k]={ username:x.username, name:x.name||x.username }; });
    (r.izin||[]).forEach(function(x){ var k=x.username.toLowerCase();
      if(!people[k]) people[k]={ username:x.username, name:x.name||x.username }; });
    var cols=Object.keys(people).sort(function(a,b){ return people[a].name.localeCompare(people[b].name); });

    /* --- indeks absensi & izin per tanggal+orang --- */
    CA.absIdx={}; CA.izIdx={};
    (r.data||[]).forEach(function(x,i){ CA.absIdx[x.date+'|'+x.username.toLowerCase()]=i; });
    (r.izin||[]).forEach(function(z){
      dateRange(z.from, z.to||z.from).forEach(function(d){ CA.izIdx[d+'|'+z.username.toLowerCase()]=z; });
    });
    CA.people=people;

    /* --- rekap per orang --- */
    var per={};
    function slot(k,nm){ if(!per[k]) per[k]={ name:nm||k, hari:0, jam:0, ot:0, sakit:0, cuti:0, unpaid:0, lain:0 }; return per[k]; }
    cols.forEach(function(k){ slot(k, people[k].name); });
    (r.data||[]).forEach(function(x){
      // hari yang ditimpa izin tidak dihitung sebagai hari kerja (biar tidak dobel)
      if(CA.izIdx[x.date+'|'+x.username.toLowerCase()]) return;
      var p=slot(x.username.toLowerCase(), x.name);
      if(x.masuk) p.hari++;
      p.jam+=Number(x.durasi)||0;
    });
    (r.lembur||[]).forEach(function(x){ slot(x.username.toLowerCase(), x.name).ot += x.hours; });
    (r.izin||[]).forEach(function(z){
      var p=slot(z.username.toLowerCase(), z.name);
      var n=dateRange(z.from, z.to||z.from).filter(function(d){ return d>=r.from && d<=r.to; }).length;
      if(z.jenis==='Izin Sakit') p.sakit+=n; else if(z.jenis==='Cuti Tahunan') p.cuti+=n;
      else if(z.jenis==='Unpaid Leave') p.unpaid+=n; else p.lain+=n;
    });

    var html='<div class="card tight"><div class="sec" style="margin-top:0">Rekap '+fmtTgl(r.from)+' – '+fmtTgl(r.to)+'</div>'+
      '<div class="tw"><table><thead><tr><th>Nama</th><th class="num">Hari</th><th class="num">Jam</th>'+
      '<th class="num">Lembur</th><th class="num">Sakit</th><th class="num">AL</th><th class="num">UPL</th></tr></thead><tbody>'+
      (cols.length? cols.map(function(k){ var p=per[k];
        return '<tr><td style="font-weight:600">'+esc(p.name)+'</td>'+
          '<td class="num qty">'+p.hari+'</td><td class="num">'+nf(p.jam)+'</td>'+
          '<td class="num">'+(p.ot?('<b style="color:var(--blue)">'+nf(p.ot)+'</b>'):'0')+'</td>'+
          '<td class="num">'+(p.sakit||0)+'</td><td class="num">'+(p.cuti||0)+'</td><td class="num">'+(p.unpaid||0)+'</td></tr>';
      }).join('') : '<tr><td colspan="7" style="text-align:center;color:var(--muted)">Belum ada data</td></tr>')+
      '</tbody></table></div></div>';

    /* --- matriks: tanggal ke bawah, staff ke samping --- */
    html+='<div class="card tight"><div class="sec" style="margin-top:0">Absensi Harian</div>';
    if(!cols.length){
      html+='<div class="empty"><div class="ei">👥</div><div>Belum ada staff aktif di sheet USERS</div></div>';
    } else {
      var dates=dateRange(r.from, r.to).reverse();     // terbaru di atas
      html+='<div class="mtx"><table><thead><tr><th class="cnr">Tgl</th>'+
        cols.map(function(k){ return '<th>'+esc(people[k].name)+'</th>'; }).join('')+'</tr></thead><tbody>'+
        dates.map(function(d,ri){
          var cls=(d===S.today?'today':(ri%2?'alt':''));
          return '<tr class="'+cls+'"><td class="dt">'+fmtShort(d)+'</td>'+
            cols.map(function(k){ return cellHtml(d,k); }).join('')+'</tr>';
        }).join('')+'</tbody></table></div>'+
        '<div class="legend"><span><b>SAKIT</b> izin sakit</span><span><b>AL</b> cuti tahunan</span>'+
        '<span><b>UPL</b> unpaid leave</span><span><b>IZIN LAIN</b> izin lainnya</span></div>'+
        '<div style="font-size:11.5px;color:var(--muted);margin-top:8px">Ketuk sel untuk lihat foto'+
        (S.m.canApprove?' & koreksi jam':'')+'. Kode izin hanya menimpa tampilan — jam aslinya tetap tersimpan di sheet.</div>';
    }
    html+='</div>';

    /* --- izin approved (keterangan + lampiran) --- */
    if((r.izin||[]).length){
      html+='<div class="card tight"><div class="sec" style="margin-top:0">Izin disetujui</div>'+
        r.izin.map(function(z){
          var kd=izKode(z.jenis);
          return '<div class="rq"><div class="top"><b>'+esc(z.name)+'</b><span class="kode '+kd[1]+'">'+esc(kd[0])+'</span></div>'+
            '<div class="meta">'+fmtTgl(z.from)+(z.to!==z.from?(' – '+fmtTgl(z.to)):'')+'<br>'+esc(z.keterangan)+'</div>'+
            (z.photo?('<div style="margin-top:8px">'+imgTag(z.photo)+'</div>'):'')+'</div>';
        }).join('')+'</div>';
    }
    box.innerHTML=html;
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
window.loadCA=loadCA;

function cellHtml(date, ukey){
  var key=date+'|'+ukey;
  var iz=CA.izIdx[key];
  var open='<td class="cellv" onclick="cellDetail(\''+date+'\',\''+ukey+'\')">';
  if(iz){ var kd=izKode(iz.jenis); return open+'<span class="kode '+kd[1]+'">'+esc(kd[0])+'</span></td>'; }
  var i=CA.absIdx[key];
  if(i===undefined) return open+'<span class="no">—</span></td>';
  var x=CA.data[i];
  return open+'<div class="ci">'+(x.masuk||'—')+'</div>'+
    (x.pulang?('<div class="co">'+x.pulang+'</div>'):'<div class="pend">belum</div>')+'</td>';
}

function cellDetail(date, ukey){
  var p=CA.people[ukey]||{ username:ukey, name:ukey };
  var iz=CA.izIdx[date+'|'+ukey];
  var i=CA.absIdx[date+'|'+ukey];
  var x=(i===undefined)?null:CA.data[i];

  var h='<div style="font-size:12.5px;color:var(--muted);margin-bottom:11px">'+esc(p.name)+' · '+fmtTgl(date)+'</div>';
  if(iz){
    var kd=izKode(iz.jenis);
    h+='<div class="rq"><div class="top"><b>'+esc(iz.jenis)+'</b><span class="kode '+kd[1]+'">'+esc(kd[0])+'</span></div>'+
      '<div class="meta">'+fmtTgl(iz.from)+(iz.to!==iz.from?(' – '+fmtTgl(iz.to)):'')+'<br>'+esc(iz.keterangan)+'</div>'+
      (iz.photo?('<div style="margin-top:8px">'+imgTag(iz.photo)+'</div>'):'')+'</div>';
  }
  if(x){
    h+='<div class="stat" style="margin-bottom:11px">'+
      '<div class="s"><b style="color:var(--ok);font-size:16px">'+(x.masuk||'—')+'</b><span>Clock In</span></div>'+
      '<div class="s"><b style="color:var(--orange);font-size:16px">'+(x.pulang||'—')+'</b><span>Clock Out</span></div>'+
      '<div class="s"><b style="font-size:16px">'+(x.durasi?nf(x.durasi):'—')+'</b><span>Jam kerja</span></div></div>';
    var fotos='';
    if(x.fotoMasuk) fotos+='<div>'+imgTag(x.fotoMasuk)+'<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">Masuk '+esc(x.masuk||'')+'</div></div>';
    if(x.fotoPulang) fotos+='<div>'+imgTag(x.fotoPulang)+'<div style="text-align:center;font-size:11px;color:var(--muted);margin-top:4px">Pulang '+esc(x.pulang||'')+'</div></div>';
    if(fotos) h+='<div class="row">'+fotos+'</div>';
    var lok=x.lokMasuk||x.lokPulang;
    if(lok) h+='<div style="margin-top:9px;font-size:12px"><a href="https://maps.google.com/?q='+esc(lok)+'" target="_blank" rel="noopener">📍 Lihat lokasi ('+esc(lok)+')</a></div>';
  } else if(!iz){
    h+='<div class="empty" style="padding:18px"><div class="ei">📭</div><div>Tidak ada catatan absensi</div></div>';
  }
  if(S.m.canApprove){
    h+='<div class="sec">Koreksi manual</div><div class="row">'+
      '<div><label>Jam Masuk</label><input type="time" id="edIn" value="'+esc((x&&x.masuk)||'')+'"></div>'+
      '<div><label>Jam Pulang</label><input type="time" id="edOut" value="'+esc((x&&x.pulang)||'')+'"></div></div>'+
      '<button class="btn amber" style="margin-top:10px" onclick="saveEditAbs(\''+date+'\',\''+esc(p.username)+'\')">Simpan Koreksi</button>'+
      '<div class="msg" id="edMsg"></div>';
  }
  openModal('Detail Absensi', h);
}
window.cellDetail=cellDetail;

var PEND=null;
async function renderApproval(){
  var box=$('amBox'); box.innerHTML=loading();
  try{
    var r=await api('getPending',{});
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    PEND=r;
    var total=r.lembur.length+r.izin.length+r.koreksi.length;
    if(S.m){ S.m.pending=total; try{ localStorage.setItem('monty_init',JSON.stringify(S.m)); }catch(e){} }
    var dot=$('navDot'); if(dot){ if(total) dot.textContent=total; else dot.remove(); }

    if(!total){ box.innerHTML='<div class="card"><div class="empty"><div class="ei">✅</div><div>Tidak ada pengajuan yang menunggu</div></div></div>'; return; }
    if(!r.canApprove){
      box.innerHTML='<div class="note">Kamu bisa melihat daftar pengajuan, tapi hanya AM yang bisa menyetujui.</div>'+pendHtml(r,false);
      return;
    }
    box.innerHTML=pendHtml(r,true);
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}

function pendHtml(r, canAct){
  function acts(type,row){
    if(!canAct) return '';
    return '<div class="row" style="margin-top:10px">'+
      '<button class="btn green sm" style="flex:1" onclick="decide(\''+type+'\','+row+',\'Approved\')">Setujui</button>'+
      '<button class="btn red sm" style="flex:1" onclick="askReject(\''+type+'\','+row+')">Tolak</button></div>';
  }
  var h='';
  if(r.lembur.length){
    h+='<div class="sec" style="margin-top:0">⏱️ Lembur ('+r.lembur.length+')</div>'+
      r.lembur.map(function(x){
        return '<div class="rq"><div class="top"><b>'+esc(x.name)+'</b><span class="badge b-blue">'+nf(x.hours)+' jam</span></div>'+
          '<div class="meta">'+fmtTgl(x.date)+'<br>'+esc(x.reason)+'</div>'+acts('ot',x.row)+'</div>';
      }).join('');
  }
  if(r.izin.length){
    h+='<div class="sec">📝 Izin ('+r.izin.length+')</div>'+
      r.izin.map(function(x){
        return '<div class="rq"><div class="top"><b>'+esc(x.name)+'</b><span class="badge b-blue">'+esc(x.jenis)+'</span></div>'+
          '<div class="meta">'+fmtTgl(x.date)+(x.to&&x.to!==x.date?(' – '+fmtTgl(x.to)):'')+'<br>'+esc(x.keterangan)+'</div>'+
          (x.photo?('<div style="margin-top:9px">'+imgTag(x.photo)+'</div>'):'')+acts('izin',x.row)+'</div>';
      }).join('');
  }
  if(r.koreksi.length){
    h+='<div class="sec">🔧 Koreksi Absen ('+r.koreksi.length+')</div>'+
      r.koreksi.map(function(x){
        return '<div class="rq"><div class="top"><b>'+esc(x.name)+'</b><span class="badge b-blue">'+
          (x.tipe==='in'?'Masuk':'Pulang')+' → '+esc(x.jam)+'</span></div>'+
          '<div class="meta">'+fmtTgl(x.date)+'<br>'+esc(x.reason)+'</div>'+acts('fix',x.row)+'</div>';
      }).join('');
  }
  return h;
}

async function decide(type,row,dec,reason){
  if(dec==='Approved' && !confirm('Setujui pengajuan ini?')) return;
  try{
    var r=await api('decide',{ type:type, row:row, decision:dec, reason:reason||'' });
    if(!r.ok){ alert(r.msg); return; }
    closeModal();
    renderApproval();
  }catch(e){ alert(e.message); }
}
window.decide=decide;

function askReject(type,row){
  openModal('Tolak Pengajuan',
    '<div class="fg"><label>Alasan penolakan (wajib)</label><textarea id="rjReason" maxlength="200" placeholder="Jelaskan alasannya"></textarea></div>'+
    '<button class="btn red" onclick="doReject(\''+type+'\','+row+')">Tolak Pengajuan</button><div class="msg" id="rjMsg"></div>');
}
window.askReject=askReject;
function doReject(type,row){
  var v=$('rjReason').value.trim();
  if(!v){ say('rjMsg','Alasan wajib diisi'); return; }
  decide(type,row,'Rejected',v);
}
window.doReject=doReject;

async function loadWstDay(){

      (r.canSeeValue?('<div style="display:flex;justify-content:space-between;align-items:center;background:#FFFBF4;border-radius:12px;padding:11px 13px;margin-bottom:11px">'+
        '<span style="font-size:12.5px;font-weight:600;color:var(--muted)">Total nilai wastage</span><b class="val">'+rp(r.totalValue)+'</b></div>'):'')+

      '<div id="wiPrev" style="margin-top:9px"></div></div>'+
    '<button class="btn" id="wiSave" onclick="saveWastage()">Simpan Wastage</button><div class="msg" id="wiMsg"></div></div>';

function wiUnit(){ var s=$('wiItem'), o=s.options[s.selectedIndex]; $('wiUnitTxt').value=o?(o.dataset.u||''):''; }

async function wiPhoto(inp){
  var f=inp.files[0]; if(!f) return;
  $('wiPrev').innerHTML='<span class="spin"></span> Memproses foto…';
  try{ WST.photo=await compress(f,860,0.5); $('wiPrev').innerHTML='<img class="photo" src="'+WST.photo+'">'; }
  catch(e){ $('wiPrev').innerHTML='<span style="color:var(--err);font-size:12.5px">'+esc(e.message)+'</span>'; }
}
window.wiPhoto=wiPhoto;

async function saveWastage(){
  var item=$('wiItem').value, qty=$('wiQty').value;
  if(!item){ say('wiMsg','Pilih item dulu'); return; }
  if(!(Number(qty)>0)){ say('wiMsg','Qty harus lebih dari 0'); return; }
  if(!WST.photo){ say('wiMsg','Foto bukti wajib'); return; }
  var b=$('wiSave'); b.disabled=true; b.innerHTML='<span class="spin"></span> Menyimpan…';
  try{
    var r=await api('submitWastage',{ date:$('wiDate').value, item:item, unit:$('wiUnitTxt').value,
      qty:Number(qty), reason:$('wiReason').value, photo:WST.photo });
    if(!r.ok){ say('wiMsg', r.msg||'Gagal'); return; }
    say('wiMsg','✅ '+r.msg, true);
    $('wiQty').value=''; $('wiItem').value=''; $('wiUnitTxt').value=''; $('wiPrev').innerHTML=''; WST.photo=null;
  }catch(e){ say('wiMsg', e.message); }
  finally{ b.disabled=false; b.textContent='Simpan Wastage'; }
}
window.saveWastage=saveWastage;

/* ==================================================================
   4. STOCK OPNAME
   ================================================================== */
var SOIN={ rows:[] };

function pgSO(v){
  if(S.user.role==='Staff') return renderSOInput(v);
  v.innerHTML='<div class="card tight"><div class="ctitle">📦 Hasil Stock Opname</div>'+
    '<div class="fg"><label>Tanggal</label><select id="soDate" onchange="loadSOView()"><option>Memuat…</option></select></div>'+
    '</div><div id="soBox"></div>';
  loadSOView(true);
}
async function loadSOView(first){
  var box=$('soBox'); box.innerHTML=loading();
  try{
    var r=await api('getSO', first===true?{}:{ date:$('soDate').value });
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    if(first===true){
      $('soDate').innerHTML=(r.dates.length?r.dates:[r.date]).map(function(d){
        return '<option value="'+d+'"'+(d===r.date?' selected':'')+'>'+fmtTgl(d)+'</option>'; }).join('');
    }
    if(!r.rows.length){ box.innerHTML='<div class="card"><div class="empty"><div class="ei">📦</div><div>Belum ada data SO untuk tanggal ini</div></div></div>'; return; }
    box.innerHTML='<div class="card tight">'+
      (r.canSeeValue?('<div style="display:flex;justify-content:space-between;align-items:center;background:#FFFBF4;border-radius:12px;padding:11px 13px;margin-bottom:11px">'+
        '<span style="font-size:12.5px;font-weight:600;color:var(--muted)">Total nilai stok</span><b class="val">'+rp(r.totalValue)+'</b></div>'):'')+
      '<div class="tw"><table><thead><tr><th>Item</th><th class="num">Qty</th>'+(r.canSeeValue?'<th class="num">Nilai</th>':'')+'</tr></thead><tbody>'+
      r.rows.map(function(x){
        return '<tr><td style="font-weight:600">'+esc(x.item)+'</td>'+
          '<td class="num"><span class="qty">'+packBreak(x.qty,x.packSize,x.packName,x.unit)+'</span>'+
          (x.packSize>0&&x.packName?('<br><small style="color:var(--muted);font-weight:500">'+nf(x.qty)+' '+esc(x.unit||'')+'</small>'):'')+'</td>'+
          (r.canSeeValue?('<td class="num val">'+rp(x.value)+'</td>'):'')+'</tr>';
      }).join('')+'</tbody></table></div>'+
      '<div style="font-size:11.5px;color:var(--muted);margin-top:9px">'+r.rows.length+' item ter-opname pada '+fmtTgl(r.date)+'</div></div>';
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
window.loadSOView=loadSOView;

function renderSOInput(v){
  v.innerHTML='<div class="card tight"><div class="ctitle">📦 Input Stock Opname</div>'+
    '<div class="note">Isi <b>pack</b> (kemasan utuh) dan <b>ceceran</b> (sisa satuan). Contoh Lime Syrup 2500ml/btl: 5 btl + 250 ml sisa &rarr; pack 5, ceceran 250. Item yang dikosongkan tidak disimpan — kalau stok memang habis, tulis <b>0</b>.</div>'+
    '<div class="fg"><label>Tanggal</label><input type="date" id="soiDate" value="'+S.today+'" max="'+S.today+'" onchange="loadSODraft()"></div>'+
    '<input type="text" id="soiSearch" placeholder="🔍 Cari item…" oninput="filterList(\'soi\')"></div><div id="soiBox">'+loading()+'</div>';
  loadSODraft();
}
async function loadSODraft(){
  var box=$('soiBox'); box.innerHTML=loading();
  try{
    var r=await api('getSODraft',{ date:$('soiDate').value });
    if(!r.ok){ box.innerHTML='<div class="empty">'+esc(r.msg)+'</div>'; return; }
    SOIN.rows=r.rows;
    if(!r.rows.length){ box.innerHTML='<div class="card"><div class="empty"><div class="ei">📋</div><div>Sheet <b>PRICE</b> masih kosong.<br>Isi daftar barangnya dulu di spreadsheet.</div></div></div>'; return; }
    box.innerHTML='<div class="ilist" id="soiList">'+
      r.rows.map(function(x,i){ return itemRow(x,i,'soi'); }).join('')+'</div>'+
      '<div class="stickybar"><span class="cnt" id="soiCnt">—</span><button class="btn sm" id="soiSave" onclick="saveSO()">Simpan SO</button></div>'+
      '<div class="msg" id="soiMsg"></div>';
    refreshTotals('soi'); updCount('soi');
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
window.loadSODraft=loadSODraft;

function rowVals(el){
  var pk=el.querySelector('.pk'), ls=el.querySelector('.ls');
  return { pack: pk?pk.value:'', loose: ls?ls.value:'' };
}
function rowTotal(el, rows){
  var v=rowVals(el), x=rows[Number(el.dataset.i)];
  if(v.pack==='' && v.loose==='') return null;
  return (Number(v.pack)||0)*(x.packSize||0) + (Number(v.loose)||0);
}
function rowChange(inp,pfx){
  var el=inp.closest('.irow');
  var rows = pfx==='soi'?SOIN.rows:INB.rows;
  var t=rowTotal(el, rows), x=rows[Number(el.dataset.i)];
  el.classList.toggle('filled', pfx==='inb' ? (t!==null && t>0) : t!==null);
  el.querySelector('.tot').textContent = (t===null||!(x.packSize>0&&x.packName)) ? '' : ('= '+nf(t)+' '+(x.unit||''));
  updCount(pfx);
}
window.rowChange=rowChange;
function refreshTotals(pfx){
  var list=$(pfx+'List'); if(!list) return;
  var rows = pfx==='soi'?SOIN.rows:INB.rows;
  Array.prototype.forEach.call(list.children,function(el){
    var t=rowTotal(el, rows), x=rows[Number(el.dataset.i)];
    el.querySelector('.tot').textContent = (t===null||!(x.packSize>0&&x.packName)) ? '' : ('= '+nf(t)+' '+(x.unit||''));
  });
}

function filterList(pfx){
  var q=$(pfx+'Search').value.trim().toLowerCase(), list=$(pfx+'List');
  if(!list) return;
  Array.prototype.forEach.call(list.children,function(el){
    el.style.display = (!q || el.dataset.nm.indexOf(q)>=0) ? '' : 'none';
  });
}
window.filterList=filterList;

function collect(pfx, rows){
  var list=$(pfx+'List'), out=[];
  if(!list) return out;
  Array.prototype.forEach.call(list.children,function(el){
    var v=rowVals(el);
    if(v.pack==='' && v.loose==='') return;
    var x=rows[Number(el.dataset.i)];
    out.push({ name:x.name, unit:x.unit,
               pack: v.pack===''?0:Number(v.pack),
               loose: v.loose===''?0:Number(v.loose),
               qty: (Number(v.pack)||0)*(x.packSize||0) + (Number(v.loose)||0) });
  });
  return out;
}
function updCount(pfx){
  var rows = pfx==='soi'?SOIN.rows:INB.rows;
  var n = collect(pfx, rows).filter(function(x){ return pfx==='inb' ? x.qty>0 : true; }).length;
  var el=$(pfx+'Cnt'); if(el) el.textContent=n+' / '+rows.length+' item terisi';
}

async function saveSO(){
  var items=collect('soi', SOIN.rows);
  if(!items.length){ say('soiMsg','Belum ada item yang diisi'); return; }
  if(!confirm('Simpan stock opname '+items.length+' item untuk '+fmtTgl($('soiDate').value)+'?')) return;
  var b=$('soiSave'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  try{
    var r=await api('saveSO',{ date:$('soiDate').value, items:items });
    say('soiMsg',(r.ok?'✅ ':'')+r.msg, r.ok);
  }catch(e){ say('soiMsg', e.message); }
  finally{ b.disabled=false; b.textContent='Simpan SO'; }
}
window.saveSO=saveSO;

/* ==================================================================
   5. INBOUND

var INB={ rows:[] }, INVIEW=null;

function pgInbound(v){
  if(S.user.role==='Staff') return renderInbInput(v);
  v.innerHTML='<div class="card tight"><div class="ctitle">🚚 Barang Masuk</div>'+
    '<div class="fg"><label>Tanggal</label><select id="inDate" onchange="loadInView()"><option>Memuat…</option></select></div>'+

async function loadInView(first){
  var box=$('inBox'); box.innerHTML=loading();

        '<span style="font-size:12.5px;font-weight:600;color:var(--muted)">Total nilai barang masuk</span><b class="val">'+rp(r.totalValue)+'</b></div>'):'')+
      '<div class="tw"><table><thead><tr><th>Item</th><th class="num">Qty</th>'+(r.canSeeValue?'<th class="num">Nilai</th>':'')+'<th></th></tr></thead><tbody>'+
      r.rows.map(function(x,i){
        return '<tr><td style="font-weight:600">'+esc(x.item)+'</td>'+
          '<td class="num"><span class="qty">'+packBreak(x.qty,x.packSize,x.packName,x.unit)+'</span>'+
          (x.packSize>0&&x.packName?('<br><small style="color:var(--muted);font-weight:500">'+nf(x.qty)+' '+esc(x.unit||'')+'</small>'):'')+'</td>'+
          (r.canSeeValue?('<td class="num val">'+rp(x.value)+'</td>'):'')+
          '<td class="num">'+(x.entries&&x.entries.length?('<a onclick="inbDetail('+i+')">'+x.entries.length+' ›</a>'):'—')+'</td></tr>';
      }).join('')+'</tbody></table></div></div>';
  }catch(e){ box.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
window.loadInView=loadInView;

function inbDetail(i){
  var x=INVIEW.rows[i];
  openModal(esc(x.item),
    '<div style="font-size:12.5px;color:var(--muted);margin-bottom:11px">'+fmtTgl(INVIEW.date)+
      ' · total '+packBreak(x.qty,x.packSize,x.packName,x.unit)+'</div>'+
    x.entries.map(function(e){
      return '<div class="rq"><div class="top"><b>'+packBreak(e.qty,x.packSize,x.packName,x.unit)+'</b>'+
        '<span style="font-size:12px;color:var(--muted)">'+esc(e.time)+'</span></div>'+
        '<div class="meta">'+esc(e.source||'—')+(e.sj?(' · SJ '+esc(e.sj)):'')+
        (e.note?('<br>'+esc(e.note)):'')+'<br>oleh '+esc(e.by)+'</div></div>';
    }).join(''));
}
window.inbDetail=inbDetail;

function renderInbInput(v){
  var items=S.m.items||[];
  INB.rows=items.slice();
  v.innerHTML='<div class="card tight"><div class="ctitle">🚚 Input Barang Masuk</div>'+
    '<div class="note">Isi <b>pack</b> dan/atau <b>ceceran</b> barang yang benar-benar diterima. Item yang dikosongkan dianggap tidak ada kiriman. Kalau ada 2 kiriman di hari yang sama, simpan dua kali — qty otomatis ditambahkan.</div>'+
    '<div class="fg"><label>Tanggal terima</label><input type="date" id="inbDate" value="'+S.today+'" max="'+S.today+'"></div>'+
    '<div class="row"><div class="fg"><label>Sumber</label><select id="inbSource">'+
      (S.m.sources||[]).map(function(s){ return '<option>'+esc(s)+'</option>'; }).join('')+'</select></div>'+
    '<div class="fg"><label>No. Surat Jalan</label><input type="text" id="inbSJ" placeholder="opsional"></div></div>'+
    '<div class="fg"><label>Catatan</label><input type="text" id="inbNote" placeholder="opsional — mis. 1 dus penyok"></div>'+
    '<input type="text" id="inbSearch" placeholder="🔍 Cari item…" oninput="filterList(\'inb\')"></div>'+
    (items.length
      ? ('<div class="ilist" id="inbList">'+items.map(function(x,i){ return itemRow(x,i,'inb'); }).join('')+'</div>'+
        '<div class="stickybar"><span class="cnt" id="inbCnt">0 / '+items.length+' item terisi</span>'+
        '<button class="btn sm" id="inbSave" onclick="saveInbound()">Simpan</button></div><div class="msg" id="inbMsg"></div>')
      : '<div class="card"><div class="empty"><div class="ei">📋</div><div>Sheet <b>PRICE</b> masih kosong.<br>Isi daftar barangnya dulu di spreadsheet.</div></div></div>');
}

async function saveInbound(){
  var items=collect('inb', INB.rows).filter(function(x){ return x.qty>0; });
  if(!items.length){ say('inbMsg','Belum ada qty yang diisi'); return; }
  if(!confirm('Simpan '+items.length+' item barang masuk tanggal '+fmtTgl($('inbDate').value)+'?')) return;
  var b=$('inbSave'); b.disabled=true; b.innerHTML='<span class="spin"></span>';
  try{
    var r=await api('saveInbound',{ date:$('inbDate').value, items:items, source:$('inbSource').value,
      suratJalan:$('inbSJ').value.trim(), note:$('inbNote').value.trim() });
    say('inbMsg',(r.ok?'✅ ':'')+r.msg, r.ok);
    if(r.ok){
      Array.prototype.forEach.call($('inbList').children,function(el){
        Array.prototype.forEach.call(el.querySelectorAll('input'),function(i){ i.value=''; });
        el.classList.remove('filled');
        el.querySelector('.tot').textContent='';
      });
      $('inbSJ').value=''; $('inbNote').value=''; updCount('inb');
    }
  }catch(e){ say('inbMsg', e.message); }
  finally{ b.disabled=false; b.textContent='Simpan'; }
}
window.saveInbound=saveInbound;
